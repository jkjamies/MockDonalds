        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: iosApp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "${TEAM_ID}"
    dependencies:
      - target: iosApp

schemes:
  iOSApp:
    build:
      targets:
        iosApp: all
        iosAppTests: [test]
        iosAppE2ETests: [test]
        iosAppBenchmarks: [test]
    run:
      config: US-Int-Debug
    test:
      config: US-Int-Debug
      testPlans:
        - path: iosApp.xcodeproj/xcshareddata/TestPlans/AllTests.xctestplan
          defaultPlan: true
        - path: iosApp.xcodeproj/xcshareddata/TestPlans/UnitTests.xctestplan
        - path: iosApp.xcodeproj/xcshareddata/TestPlans/UIComponentTests.xctestplan
        - path: iosApp.xcodeproj/xcshareddata/TestPlans/NavIntTests.xctestplan
        - path: iosApp.xcodeproj/xcshareddata/TestPlans/E2ETests.xctestplan
        - path: iosApp.xcodeproj/xcshareddata/TestPlans/Benchmarks.xctestplan
    profile:
      config: US-Prod-Release
    analyze:
      config: US-Int-Debug
    archive:
      config: US-Prod-Release
