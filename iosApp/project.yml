      US-Mte-Release: Configuration/us/US-Mte-Release.xcconfig
      US-Prod-Debug: Configuration/us/US-Prod-Debug.xcconfig
      US-Prod-Release: Configuration/us/US-Prod-Release.xcconfig
      CA-Int-Debug: Configuration/ca/CA-Int-Debug.xcconfig
      CA-Int-Release: Configuration/ca/CA-Int-Release.xcconfig
      CA-Mte-Debug: Configuration/ca/CA-Mte-Debug.xcconfig
      CA-Mte-Release: Configuration/ca/CA-Mte-Release.xcconfig
      CA-Prod-Debug: Configuration/ca/CA-Prod-Debug.xcconfig
      CA-Prod-Release: Configuration/ca/CA-Prod-Release.xcconfig
      DE-Int-Debug: Configuration/de/DE-Int-Debug.xcconfig
      DE-Int-Release: Configuration/de/DE-Int-Release.xcconfig
      DE-Mte-Debug: Configuration/de/DE-Mte-Debug.xcconfig
      DE-Mte-Release: Configuration/de/DE-Mte-Release.xcconfig
      DE-Prod-Debug: Configuration/de/DE-Prod-Debug.xcconfig
      DE-Prod-Release: Configuration/de/DE-Prod-Release.xcconfig
      AU-Int-Debug: Configuration/au/AU-Int-Debug.xcconfig
      AU-Int-Release: Configuration/au/AU-Int-Release.xcconfig
      AU-Mte-Debug: Configuration/au/AU-Mte-Debug.xcconfig
      AU-Mte-Release: Configuration/au/AU-Mte-Release.xcconfig
      AU-Prod-Debug: Configuration/au/AU-Prod-Debug.xcconfig
      AU-Prod-Release: Configuration/au/AU-Prod-Release.xcconfig
      CORE-Int-Debug: Configuration/core/CORE-Int-Debug.xcconfig
      CORE-Int-Release: Configuration/core/CORE-Int-Release.xcconfig
      CORE-Mte-Debug: Configuration/core/CORE-Mte-Debug.xcconfig
      CORE-Mte-Release: Configuration/core/CORE-Mte-Release.xcconfig
      CORE-Prod-Debug: Configuration/core/CORE-Prod-Debug.xcconfig
      CORE-Prod-Release: Configuration/core/CORE-Prod-Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mockdonalds.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/iosApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/iosApp
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "${TEAM_ID}"
    dependencies:
      - target: iosApp
      - package: ViewInspector

  iosAppE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iosAppE2ETests
    configFiles:
      US-Int-Debug: Configuration/us/US-Int-Debug.xcconfig
      US-Int-Release: Configuration/us/US-Int-Release.xcconfig
      US-Mte-Debug: Configuration/us/US-Mte-Debug.xcconfig
      US-Mte-Release: Configuration/us/US-Mte-Release.xcconfig
      US-Prod-Debug: Configuration/us/US-Prod-Debug.xcconfig
      US-Prod-Release: Configuration/us/US-Prod-Release.xcconfig
      CA-Int-Debug: Configuration/ca/CA-Int-Debug.xcconfig
      CA-Int-Release: Configuration/ca/CA-Int-Release.xcconfig
      CA-Mte-Debug: Configuration/ca/CA-Mte-Debug.xcconfig
      CA-Mte-Release: Configuration/ca/CA-Mte-Release.xcconfig
      CA-Prod-Debug: Configuration/ca/CA-Prod-Debug.xcconfig
      CA-Prod-Release: Configuration/ca/CA-Prod-Release.xcconfig
