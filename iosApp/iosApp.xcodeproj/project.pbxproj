		4B7F36F4D5A9FBB5D12E57FE /* Generate Circuit factory registry */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Generate Circuit factory registry";
			outputFileListPaths = (
			);
			outputPaths = (
				"$(SRCROOT)/iosApp/Generated/GeneratedCircuitFactories.swift",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Scans every Swift source under iosApp/ for @CircuitInject and emits\n# iosApp/Generated/GeneratedCircuitFactories.swift, which extends\n# CircuitIos with `generatedFactories()` so AppDelegate stays a one-liner.\n# The compiled executable is reused across builds — `swift build` is a\n# no-op when nothing changed, so the steady-state cost of this phase is\n# the parse + emit pass (sub-second on ~30 files).\nset -euo pipefail\nOUTPUT=\"$SRCROOT/iosApp/Generated/GeneratedCircuitFactories.swift\"\nmkdir -p \"$(dirname \"$OUTPUT\")\"\ncd \"$SRCROOT/../build-tooling/CircuitFactoryRegistry\"\n# Clear Xcode's iOS-build env vars so `swift build` evaluates the macOS\n# manifest against the macOS SDK. Without this, SDKROOT leaks in as\n# iphonesimulator and SwiftPM fails compiling the manifest.\nunset SDKROOT PLATFORM_NAME EFFECTIVE_PLATFORM_NAME TARGET_DEVICE_PLATFORM_NAME TOOLCHAINS\nswift build -c release --product CircuitFactoryRegistry\nBIN=\"$(swift build -c release --product CircuitFactoryRegistry --show-bin-path)/CircuitFactoryRegistry\"\n# Pipe NUL-separated paths via stdin instead of xargs so the generator\n# runs in a single invocation. xargs would fan out past ARG_MAX, and\n# each fan-out would truncate $OUTPUT — silently dropping entries.\nfind \"$SRCROOT/iosApp\" -name '*.swift' -not -path '*/Generated/*' -print0 \\\n  | \"$BIN\" --paths-from-stdin --output \"$OUTPUT\"\n";
		};
