name: Smoke

# Deliberately high-level. This is NOT the full verification pipeline — that lives
# in `.agents/standards/verification.md`, is driven by the `verify` skill (scopes:
# diff / full / all), and needs an emulator and a simulator. What runs here is one
# market/env combo per platform: lint, architecture, build, unit tests.
#
# What this gate exists to catch is the class of failure that makes the repo
# unusable for anyone who is not the author: a build that only configures on one
# machine, a module that never got wired into settings.gradle.kts, an architecture
# rule that has started failing, or a Kotlin/Native change that only breaks once
# Xcode links the framework. Device-bound test levels (androidDeviceTest, navint,
# e2e) and the market × env matrix stay out of scope on purpose.
#
# Two jobs, because the platforms fail differently: `android` covers the shared +
# Android side on Linux, `ios` links the actual framework on macOS. A source-set or
# `export()` mistake is invisible to the Linux job — Apple targets cannot be built
# off macOS at all — so the iOS job is the only thing that proves the framework
# still builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

# Read-only. Nothing here comments, pushes, or publishes; the only write this workflow
# performs is `actions/upload-artifact`, which is authorised by the run itself.
permissions:
  contents: read

jobs:
  android:
    name: Kotlin + Android (us-int-debug)
    runs-on: ubuntu-latest
    # 90, not 45: the first run was cancelled at 45m14s. A cold build here is 60+ KMP modules
    # through KSP, Metro codegen and the Compose compiler, with no Gradle cache to restore —
    # `gradle/actions/setup-gradle` only writes cache entries from the default branch, and main
    # has never run CI. Once this lands and main populates the cache, runs drop well under this.
    timeout-minutes: 90

    steps:
      # persist-credentials: false — nothing in this job talks to git after checkout, so
      # leaving the token in .git/config only widens what a compromised build script reaches.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # JDK 21 matches the `jvmToolchain(21)` declared by build-tooling and
      # testing/architecture-check. Everything else targets JVM 17 bytecode,
      # which compiles fine on a 21 daemon.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # Configuration smoke first: every module in the graph — including the features
      # auto-discovered by settings.gradle.kts — resolves and configures. Cheap, and
      # it fails with a clearer message than a compile error when the graph is broken.
      # This is the step that would have caught the machine-pinned JDK path.
      - name: Configure module graph
        run: ./gradlew projects

      # Lint before the expensive steps so style failures surface fast.
      # NOTE: this task analyses the commonMain metadata compilation only — it does
      # NOT cover androidMain (where every *Ui.kt lives) or iosMain. Widening detekt
      # to the platform source sets is worth doing, but it has never run against them,
      # so it belongs in its own change where the fallout can be fixed deliberately.
      - name: Lint (detekt, commonMain)
        run: ./gradlew detektMetadataCommonMain

      # The repo's own architecture backbone. `verify diff` runs this unconditionally
      # regardless of what changed, so CI does the same.
      - name: Architecture (Konsist)
        run: ./gradlew :testing:architecture-check:test

      # One variant, not the matrix. Configuration alone compiles nothing, so without
      # this a Kotlin error or a broken DI graph reaches main unnoticed. `us`/`int` is
      # the documented default combo.
      - name: Build (Android, us-int-debug)
        run: ./gradlew :androidApp:assembleUsIntDebug

      - name: Unit tests (Kotest, host)
        run: ./gradlew testAndroidHostTest

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/tests/
            **/build/reports/detekt/
          if-no-files-found: ignore

  ios:
    name: iOS framework + app (US-Int-Debug)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Xcode build drives Gradle itself: the "Build Kotlin framework via Gradle"
      # preBuildScript runs `:composeApp:embedAndSignAppleFrameworkForXcode` with
      # -Pmarket/-Penv/-PbuildType forwarded from the active xcconfig. gradlew resolves
      # its JDK from JAVA_HOME, which setup-java exports for the whole job — including
      # Xcode's script phases.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # swift-syntax backs both CircuitMacros (SPM dependency of the app target) and
      # CircuitFactoryRegistry (built by the codegen Run Script Phase). Cold, that is
      # the single most expensive thing in this job; cached, it is close to free.
      # CircuitFactoryRegistry's .build is cached separately because the Run Script
      # Phase reuses the compiled executable across builds by design.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
            build-tooling/CircuitFactoryRegistry/.build
            iosApp/ArchitectureCheck/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', '**/Package.swift') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # Lint first — it needs no build, so style failures do not cost a 20-minute
      # compile to discover.
      - name: Lint (SwiftLint)
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint --config .swiftlint.yml

      # Deliberately builds the COMMITTED project rather than running `xcodegen generate`
      # first. `iosApp/AGENTS.md` requires project.yml and project.pbxproj to be committed
      # together precisely so "CI and team members who don't run xcodegen locally" can
      # build, and xcodegen owns only the pbxproj — regenerating risks disturbing the
      # committed `xcshareddata` it does not manage (the six test plans, the pinned SPM
      # `Package.resolved`), which would fail the build for reasons unrelated to the change
      # under test. A pbxproj-vs-project.yml drift check belongs in its own job.

      # A generic simulator destination builds without booting a device, so the build
      # signal — the critical one, and the only check on Kotlin/Native output — does not
      # depend on which simulator runtimes the image happens to ship.
      # -skipMacroValidation is required: CircuitMacros is a Swift macro package and
      # xcodebuild otherwise blocks on the non-interactive macro trust prompt.
      - name: Build iOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iOSApp \
            -configuration US-Int-Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # Pure-logic Swift tests (`iosAppTests/Unit/`). Kept separate from the build so a
      # simulator-availability problem cannot mask the build result. Shares DerivedData
      # with the step above, so this is mostly link + run.
      - name: Unit tests (Swift Testing, simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iOSApp \
            -configuration US-Int-Debug \
            -testPlan UnitTests \
            -destination 'platform=iOS Simulator,OS=latest,name=iPhone 16' \
            -derivedDataPath build/DerivedData \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      # Harmonize — the iOS half of the architecture suite. Host-only, no simulator,
      # and the counterpart to the Konsist run in the `android` job.
      - name: Architecture (Harmonize)
        run: swift test --package-path iosApp/ArchitectureCheck
