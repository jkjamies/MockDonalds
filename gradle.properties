org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8
# No `org.gradle.java.home` here on purpose. An absolute JDK path is machine-specific and
# breaks every non-authoring machine (CI, Linux, Windows, agent containers) before Gradle
# even reaches configuration. JDK selection is delegated to Gradle toolchains instead:
# modules declare `jvmToolchain(21)` / `jvmTarget`, and the foojay resolver in
# settings.gradle.kts provisions a matching JDK when the daemon JVM isn't one.
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
